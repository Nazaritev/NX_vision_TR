# Only this file and rc_localization.yaml need editing; no launch CLI overrides.
# live: starts MID360 + FAST-LIO + robot TF. external: reuses running inputs/bag.
input_mode: live

# local: isolate standalone DDS from the host's eno1-only profile, which lacks
# a localhost peer. system: inherit existing DDS settings for external inputs.
dds_profile: local
ros_domain_id: 0
start_robot_state_publisher: true
start_rviz: true
# map: static map and verified global pose; odom: inspect robot TF before localization.
rviz_view: map
use_sim_time: false

# Relative to the installed rc_bringup/map directory; absolute paths remain
# accepted for an external map, but the shipped entry is portable.
map_file: 1.pcd
fast_lio_config: rc_localization_fast_lio.yaml
